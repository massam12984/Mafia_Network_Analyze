<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mafia Network Analyzer — Enter the Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:   #07080a;
      --dark:    #0e0f13;
      --panel:   #13151c;
      --border:  rgba(180,30,30,0.35);
      --red:     #c0132a;
      --red-hot: #ff2244;
      --gold:    #c9a84c;
      --silver:  #8a8fa0;
      --text:    #d8dae0;
      --dim:     #5a5e6a;
      --green:   #2ecc71;
      --font-display: 'Cinzel', serif;
      --font-body:    'Courier Prime', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background canvas */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; opacity: 0.45;
    }

    /* ── Main container ── */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 1.2;
    }
    .logo-title span { color: var(--red-hot); }
    .logo-sub {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 0.4rem;
    }

    /* Card */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem 2.2rem;
      box-shadow: 0 0 60px rgba(180,30,30,0.08), 0 4px 24px rgba(0,0,0,0.6);
    }

    /* Tabs */
    .tabs {
      display: flex;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--dim);
      font-family: var(--font-display);
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.7rem 0;
      cursor: pointer;
      transition: color 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .tab-btn:hover:not(.active) { color: var(--silver); }

    /* Form panels */
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .field {
      margin-bottom: 1.2rem;
    }
    .field label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 0.4rem;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,30,30,0.25);
      border-radius: 3px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201,168,76,0.15);
    }
    .field input::placeholder { color: var(--dim); }

    /* Submit button */
    .btn-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: linear-gradient(135deg, #8b0000, var(--red));
      border: 1px solid var(--red);
      border-radius: 3px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.82rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, var(--red), var(--red-hot));
      box-shadow: 0 0 18px rgba(255,34,68,0.35);
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled {
      opacity: 0.6; cursor: not-allowed;
    }

    /* Alert messages */
    .alert {
      padding: 0.7rem 1rem;
      border-radius: 3px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert.error {
      background: rgba(192,19,42,0.15);
      border: 1px solid rgba(192,19,42,0.4);
      color: #ff7070;
      display: block;
    }
    .alert.success {
      background: rgba(46,204,113,0.12);
      border: 1px solid rgba(46,204,113,0.35);
      color: var(--green);
      display: block;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer note */
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }

    /* Decorative line */
    .deco-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="auth-wrapper">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-title">Mafia <span>Network</span> Analyzer</div>
    <div class="logo-sub">Intelligence. Power. Control.</div>
  </div>

  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- ── SIGN IN ── -->
    <div class="form-panel active" id="panel-signin">
      <div id="alert-signin" class="alert"></div>

      <div class="field">
        <label>Username or Email</label>
        <input type="text" id="si-identifier" placeholder="enter username or email" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="btn-submit" id="btn-signin" onclick="doSignIn()">
        Enter the Family
      </button>
    </div>

    <!-- ── SIGN UP ── -->
    <div class="form-panel" id="panel-signup">
      <div id="alert-signup" class="alert"></div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="su-username" placeholder="choose a name" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="su-email" placeholder="your@email.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="su-password" placeholder="min 6 characters" autocomplete="new-password"/>
      </div>

      <button class="btn-submit" id="btn-signup" onclick="doSignUp()">
        Join the Family
      </button>
    </div>

    <div class="deco-line"></div>
    <div class="auth-footer">Access is verified through the MongoDB vault</div>
  </div>

</div>

<!-- ═══════════════════ Canvas Background ═══════════════════ -->
<script>
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, dots = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initDots(n = 70) {
    dots = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.8 + 0.5,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const RAD = 130;

    dots.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
      if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;

      dots.forEach(o => {
        const dx = d.x - o.x, dy = d.y - o.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RAD && dist > 0) {
          const a = (1 - dist / RAD) * 0.3;
          ctx.strokeStyle = `rgba(180,30,30,${a})`;
          ctx.lineWidth   = 0.6;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(o.x, o.y);
          ctx.stroke();
        }
      });

      ctx.fillStyle = 'rgba(201,168,76,0.55)';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initDots(); });
  resize(); initDots(); draw();
})();
</script>

<!-- ═══════════════════ Auth Logic ═══════════════════ -->
<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
  }

  function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.className = 'alert ' + type;
    el.textContent = msg;
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span> Please wait...'
      : label;
  }

  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return { status: res.status, data: await res.json() };
  }

  async function doSignIn() {
    const identifier = document.getElementById('si-identifier').value.trim();
    const password   = document.getElementById('si-password').value;

    if (!identifier || !password) {
      showAlert('alert-signin', 'Please fill in all fields.', 'error');
      return;
    }

    setLoading('btn-signin', true, 'Enter the Family');
    try {
      const { status, data } = await postJSON('/login', {
        action: 'signin', identifier, password
      });
      if (data.success) {
        showAlert('alert-signin', 'Access granted. Redirecting...', 'success');
        setTimeout(() => window.location.href = data.redirect, 800);
      } else {
        showAlert('alert-signin', data.error || 'Authentication failed.', 'error');
      }
    } catch (e) {
      showAlert('alert-signin', 'Server error. Try again.', 'error');
    } finally {
      setLoading('btn-signin', false, 'Enter the Family');
    }
  }

  async function doSignUp() {
    const username = document.getElementById('su-username').value.trim();
    const email    = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;

    if (!username || !email || !password) {
      showAlert('alert-signup', 'Please fill in all fields.', 'error');
      return;
    }

    setLoading('btn-signup', true, 'Join the Family');
    try {
      const { status, data } = await postJSON('/login', {
        action: 'signup', username, email, password
      });
      if (data.success) {
        showAlert('alert-signup', 'Welcome to the family! Redirecting...', 'success');
        setTimeout(() => window.location.href = data.redirect, 900);
      } else {
        showAlert('alert-signup', data.error || 'Registration failed.', 'error');
      }
    } catch (e) {
      showAlert('alert-signup', 'Server error. Try again.', 'error');
    } finally {
      setLoading('btn-signup', false, 'Join the Family');
    }
  }

  // Allow Enter key on inputs
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const active = document.querySelector('.form-panel.active').id;
    if (active === 'panel-signin') doSignIn();
    else doSignUp();
  });
</script>

</body>
</html>
